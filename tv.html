<!DOCTYPE html>
<html>
<head>
  <title>9Round Irvine Center Challenge</title>
  <link rel="stylesheet" type="text/css" href="styles.css"> <!-- Make sure this path is correct -->
  <link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96x96.png">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
</head>
<body>
  <!-- Embed the iframes with the Google Sheet -->
  <iframe id="sheetFrame" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRQ2ZHMxBUYYGkZ2z59Kqd94GumA60KdJ4WkzE3ysHfNgmpyrI5vyGM633foL3cJr_YNOUFJ-bPU_Kd/pubhtml?gid=152277525&single=true&widget=false&headers=false&chrome=false" frameborder="0"></iframe>
  <iframe id="sheetFrame2" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vRQ2ZHMxBUYYGkZ2z59Kqd94GumA60KdJ4WkzE3ysHfNgmpyrI5vyGM633foL3cJr_YNOUFJ-bPU_Kd/pubhtml?gid=152277525&single=true&widget=false&headers=false&chrome=false" frameborder="0"></iframe>
  <div id="loadingOverlay">
    <img src="images/logo-white-9r.png" id="loadingLogo" alt="Loading Logo">
  </div>
  <div id="top-bar"></div>  <!-- Added for demonstration, adjust as needed -->

  <script>
    document.addEventListener('DOMContentLoaded', function() {
    setBlackBackground();
    
    let currentFrame = 'sheetFrame';
    let nextFrame = 'sheetFrame2';
    let refreshToken = 0;
    // The logo is a short cover, not a wait for Google. The published
    // sheet often loads slowly or never fires iframe onload, which left
    // the overlay up for the whole request.
    const LOGO_MS = 700;
  
    function shouldRefresh() {
      const now = new Date();
      const day = now.getDay();
      const hour = now.getHours();
  
      if (day >= 1 && day <= 5) { // Weekdays
        return hour >= 7 && hour < 21;
      } else { // Weekend
        return hour >= 8 && hour < 18;
      }
    }

    function hideLogo(loadingOverlay) {
      loadingOverlay.classList.remove('displayed');
      loadingOverlay.style.pointerEvents = 'none';
    }
  
    function softRefresh() {
      if (!shouldRefresh()) return;

      const token = ++refreshToken;
      const loadingOverlay = document.getElementById('loadingOverlay');
      const current = document.getElementById(currentFrame);
      const next = document.getElementById(nextFrame);

      const url = new URL(next.src);
      url.searchParams.set('t', String(Date.now())); // Cache busting

      next.style.opacity = '0';
      next.style.display = 'block';

      loadingOverlay.classList.add('displayed');
      loadingOverlay.style.pointerEvents = 'auto';
      const logoTimer = setTimeout(function() {
        if (token !== refreshToken) return;
        hideLogo(loadingOverlay);
      }, LOGO_MS);

      // Attach before src so a fast load cannot be missed.
      next.onload = function() {
        if (token !== refreshToken) return;
        clearTimeout(logoTimer);
        hideLogo(loadingOverlay);
        current.style.opacity = '0';
        next.style.opacity = '1';

        setTimeout(function() {
          if (token !== refreshToken) return;
          current.style.display = 'none';
          current.style.opacity = '0';
          const temp = currentFrame;
          currentFrame = nextFrame;
          nextFrame = temp;
        }, 200);
      };

      next.src = url.href;
    }
  
    setInterval(softRefresh, 60000); // 60000 milliseconds = 1 minute
  
    function setBlackBackground() {
      document.body.style.backgroundColor = 'black';
      document.documentElement.style.backgroundColor = 'black';
    }
  });
  </script>

</body>
</html>
